<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krono - Maria Lety</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Cadastro</h1>
  
    <div class="form-group">
      <label for="usuario">Nome do Usuário:</label>
      <input type="text" id="nome" placeholder="Digite seu nome aqui...">
    </div>

    <!-- Upload de Imagem Rosa -->
    <div class="form-group">
      <label for="uploadImg">Adicionar sua imagem:</label>
      <input type="file" id="uploadImg" accept="image/*">
    </div>

    <button id="btn">Salvar Perfil</button>

    <div id="mensagem"></div>

    <!-- Exibição das Imagens -->
    <div class="galeria" id="galeria">
      <!-- Imagem Padrão Rosa -->
      <div class="imagem-card">
        <img src="https://i.pinimg.com/736x/14/0e/2a/140e2a06aaae0db9ce21e21b0bb767a1.jpg" alt="Estética Rosa">
      </div>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>>
